name: torrid
description: "Ronin 安卓端：打卡/随笔/漫画/画廊等多功能自用应用。"

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: 3.3.2
  riverpod_annotation: 4.0.3
  drift: 2.32.1
  shared_preferences: 2.5.5
  path_provider: ^2.1.5
  path: ^1.9.1
  go_router: ^16.1.0
  permission_handler: ^12.0.1
  uuid: ^4.5.2

  dio: ^5.9.0

  intl: ^0.20.2
  pinyin: ^3.3.0
  flutter_markdown_plus: ^1.0.5
  logging: ^1.3.0

  video_player: ^2.10.0
  image_picker: ^1.2.0
  photo_view: ^0.15.0
  image_size_getter: ^2.4.1
  cached_network_image: ^3.4.1
  image: ^4.5.4

  url_launcher: ^6.3.0

  json_annotation: 4.12.0
  multicast_dns: ^0.3.3
  flutter_cache_manager: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  
  build_runner: 2.15.1
  drift_dev: 2.32.1
  riverpod_generator: 4.0.4
  json_serializable: 6.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - android/app/src/main/res/raw/server.crt
  fonts:
    - family: kaiti
      fonts:
        - asset: assets/fonts/kaiti.ttf
    - family: iconfont
      fonts:
        - asset: assets/fonts/iconfont.ttf
