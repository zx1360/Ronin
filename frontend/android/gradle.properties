org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Disable Kotlin incremental compilation to avoid cross-drive path issues (Pub cache on C:, project on D:)
kotlin.incremental=false

# ---- R8 / D8 稳定性（Windows 文件锁规避）----
# 关闭 R8 full mode：D8/R8 desugar 的并行度更低、行为更保守，
# 对个人自用 App 的体积/性能影响可忽略，但能显著减少 Windows 上的文件句柄竞争。
android.enableR8.fullMode=false

# 限制后台 worker 数量：R8/D8 会拉起多个 worker 进程并发写 classes.dex 所在输出目录，
# 在 Windows 上多进程争抢同一文件句柄正是
# "java.nio.file.FileSystemException: ...classes.dex: 另一个程序正在使用此文件" 的常见成因。
org.gradle.workers.max=4
